server:
  port: 8080

spring:
  application:
    name: shortify
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

shortify:
  base-url: "http://localhost:8080"
  short-code:
    length: 6
    max-attempts: 10
  rate-limit:
    request-per-minute: 2
    request-per-hour: 10
  cache:
    ttl-minutes: 30
  cleanup:
    interval-minutes: 5
    expired-urls-batch-size: 100

logging:
  level:
    in.ybuilds.shortify: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{dd-MM-YY HH:mm:ss} - %msg%n"